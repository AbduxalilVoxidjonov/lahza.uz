name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FFmpeg (render testlari uchun)
        uses: FedericoCarboni/setup-ffmpeg@v3
      - run: pip install -e ".[dev]"
      - run: ruff check src tests ../eval ../scripts
      - run: pytest
        env:
          LAHZA_DEV: "1"

  ui:
    name: UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  tauri:
    name: Tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI dist (tauri-build talab qiladi)
        working-directory: app
        run: npm ci && npm run build
      - name: Sidecar o'rinbosari (faqat check uchun)
        shell: bash
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          EXT=""; [[ "$RUNNER_OS" == "Windows" ]] && EXT=".exe"
          mkdir -p app/src-tauri/binaries
          echo stub > "app/src-tauri/binaries/lahza-engine-${TRIPLE}${EXT}"
      - working-directory: app/src-tauri
        run: cargo check --locked || cargo check
