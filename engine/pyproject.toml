[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lahza-engine"
version = "0.1.0"
description = "Lahza Studio engine: oflayn o'zbekcha podkast -> Reels pipeline"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  # /v1/events WebSocket: uvicorn o'zi WS kutubxonasisiz keladi - bo'lmasa WS so'rovi 404 bilan rad etiladi.
  "websockets>=12",
  "httpx>=0.27",
  "numpy>=1.26",
  "cryptography>=42",
  "psutil>=5.9",
]

[project.optional-dependencies]
# Og'ir ML backendlar ixtiyoriy: ular faqat kerakli platformada o'rnatiladi.
asr-ctranslate2 = ["faster-whisper>=1.0"]
vad = ["silero-vad>=5.1"]
onnx = ["onnxruntime>=1.18"]
fonts = ["fonttools>=4.50"]
diarization = ["pyannote.audio>=4.0"]
vision = ["mediapipe>=0.10", "opencv-python-headless>=4.9"]
align = ["torch>=2.3", "torchaudio>=2.3"]
fast-hash = ["xxhash>=3.4"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.6"]

[project.scripts]
lahza = "lahza_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lahza_engine = ["highlight/prompts/*.txt", "db/*.sql", "render/*.json", "models/*.pub", "subtitle/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["ffmpeg: ffmpeg o'rnatilgan bo'lishi kerak bo'lgan testlar", "libass: ffmpeg libass bilan (ass filtri) yig'ilgan bo'lishi kerak bo'lgan testlar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection namunasi
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
